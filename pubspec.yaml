name: attendance_parser
description: Attendance Tracker with PDF parsing
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  file_picker: ^8.0.0
  syncfusion_flutter_pdf: ^26.1.42
  percent_indicator: ^4.2.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/guide/step1.png
    - assets/guide/step2.png
    - assets/guide/step3.png