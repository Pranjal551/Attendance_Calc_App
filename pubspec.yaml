name: attendance_parser
description: Parse NMIMS attendance PDF with OCR fallback
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core dependencies
  file_picker: ^8.0.0
  syncfusion_flutter_pdf: ^26.1.42
  percent_indicator: ^4.2.3

  # OCR + file system utilities
  path_provider: ^2.1.4
  flutter_tesseract_ocr: ^0.4.24
  webview_flutter: ^4.7.0

  # Optional (for better error handling / logging)
  intl: ^0.19.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true